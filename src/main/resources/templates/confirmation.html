<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Confirmation</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="confirm-box">
  <h2>Registration Confirmation</h2>

  <p><strong>Name:</strong> <span th:text="${student.name}"></span></p>
  <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
  <p><strong>Course:</strong> <span th:text="${student.course}"></span></p>
  <p><strong>Level:</strong> <span th:text="${student.level}"></span></p>

  <br>
  <a href="/register">Back to Registration Form</a>
</div>
</body>
</html>
